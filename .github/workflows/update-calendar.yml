name: Update calendar event dates

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_calendar.py"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install calendar libraries
        run: pip install icalendar recurring-ical-events

      - name: Generate event dates
        env:
          ICS_URL: "https://calendar.google.com/calendar/ical/f333b8404d3ee6afa7eb72db38c63e8410a7744a9d6255286ba4959a46607bca%40group.calendar.google.com/public/basic.ics"
        run: python scripts/update_calendar.py

      - name: Commit updated dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public calendar event dates"
            git pull --rebase origin main
            git push
          else
            echo "No calendar date changes."
          fi